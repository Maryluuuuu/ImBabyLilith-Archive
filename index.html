<style id="app-style">
/* Layout: una biblioteca de castillo. Folios enmarcados con capitular iluminada, sellos de lacre para la clasificacion, pestanas de codice. */
:root {
  --bg: #e6d9bd; --bg-hi: #efe5cf; --page: #f7f0e1; --page-2: #efe4cc; --ink: #2b2118; --muted: #6a5843; --rule: #c7b08a;
  --rubric: #a3301c; --accent: #24427f; --on-accent: #fbf5e8; --gold: #24427f; --init-bg: #24427f; --init-fg: #f3d27a;
  --focus: #24427f; --shadow: rgba(60, 40, 15, .32); --overlay: rgba(25, 18, 10, .6);
  --s-g: #3d6b39; --s-t: #85650f; --s-m: #ac531a; --s-e: #951d22; --s-n: #776a5a; --on-seal: #fbf5e8;
  --black: "Pirata One", "Cormorant Garamond", serif;
  --display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --sc: "Cinzel", "Cormorant SC", "Cormorant Garamond", "Garamond", serif;
  --body: "Lora", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121419; --bg-hi: #1b1e26; --page: #1d2029; --page-2: #242835; --ink: #ede4cf; --muted: #a99f8b; --rule: #3b404e;
    --rubric: #e57a62; --accent: #d9b45a; --on-accent: #16171c; --gold: #d9b45a; --init-bg: #2c3a66; --init-fg: #e9c873;
    --focus: #e9c873; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(0, 0, 0, .7);
    --s-g: #79b46f; --s-t: #d9b45a; --s-m: #e89b5d; --s-e: #ea6d6d; --s-n: #9b9484; --on-seal: #16171c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121419; --bg-hi: #1b1e26; --page: #1d2029; --page-2: #242835; --ink: #ede4cf; --muted: #a99f8b; --rule: #3b404e;
  --rubric: #e57a62; --accent: #d9b45a; --on-accent: #16171c; --gold: #d9b45a; --init-bg: #2c3a66; --init-fg: #e9c873;
  --focus: #e9c873; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(0, 0, 0, .7);
  --s-g: #79b46f; --s-t: #d9b45a; --s-m: #e89b5d; --s-e: #ea6d6d; --s-n: #9b9484; --on-seal: #16171c; color-scheme: dark;
}
/* Paletas elegidas por quien visita (ganan sobre el tema del sistema) */
:root[data-paleta="pergamino"] {
  --bg: #e6d9bd; --bg-hi: #efe5cf; --page: #f7f0e1; --page-2: #efe4cc; --ink: #2b2118; --muted: #6a5843; --rule: #c7b08a;
  --rubric: #a3301c; --accent: #24427f; --on-accent: #fbf5e8; --gold: #24427f; --init-bg: #24427f; --init-fg: #f3d27a;
  --focus: #24427f; --shadow: rgba(60, 40, 15, .32); --overlay: rgba(25, 18, 10, .6);
  --s-g: #3d6b39; --s-t: #85650f; --s-m: #ac531a; --s-e: #951d22; --s-n: #776a5a; --on-seal: #fbf5e8; color-scheme: light;
}
:root[data-paleta="castillo"] {
  --bg: #121419; --bg-hi: #1b1e26; --page: #1d2029; --page-2: #242835; --ink: #ede4cf; --muted: #a99f8b; --rule: #3b404e;
  --rubric: #e57a62; --accent: #d9b45a; --on-accent: #16171c; --gold: #d9b45a; --init-bg: #2c3a66; --init-fg: #e9c873;
  --focus: #e9c873; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(0, 0, 0, .7);
  --s-g: #79b46f; --s-t: #d9b45a; --s-m: #e89b5d; --s-e: #ea6d6d; --s-n: #9b9484; --on-seal: #16171c; color-scheme: dark;
}
:root[data-paleta="lapis"] {
  --bg: #0d1730; --bg-hi: #15224a; --page: #15214a; --page-2: #1b2a59; --ink: #f1ead8; --muted: #b4bad0; --rule: #2e3f73;
  --rubric: #f08f72; --accent: #8ab4f8; --on-accent: #0d1730; --gold: #8ab4f8; --init-bg: #8ab4f8; --init-fg: #0d1730;
  --focus: #8ab4f8; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(2, 6, 20, .72);
  --s-g: #7cc08a; --s-t: #e7c463; --s-m: #f0a165; --s-e: #f07a7a; --s-n: #a3a9bf; --on-seal: #0d1730; color-scheme: dark;
}
:root[data-paleta="bosque"] {
  --bg: #0e1c16; --bg-hi: #152a20; --page: #162a21; --page-2: #1c3429; --ink: #ede7d3; --muted: #a9b6a3; --rule: #2e4a3c;
  --rubric: #e9916b; --accent: #93c98a; --on-accent: #0e1c16; --gold: #93c98a; --init-bg: #6e2a1f; --init-fg: #ecd27e;
  --focus: #93c98a; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(2, 10, 6, .72);
  --s-g: #8cc97a; --s-t: #d9c27a; --s-m: #eda066; --s-e: #ef7b72; --s-n: #a3ad9d; --on-seal: #0e1c16; color-scheme: dark;
}
:root[data-paleta="purpura"] {
  --bg: #1c0e18; --bg-hi: #2a1524; --page: #2a1624; --page-2: #331b2c; --ink: #f2e5e7; --muted: #c4abb7; --rule: #4c2b41;
  --rubric: #f39bb1; --accent: #cfa6f0; --on-accent: #1c0e18; --gold: #cfa6f0; --init-bg: #cfa6f0; --init-fg: #3a1630;
  --focus: #cfa6f0; --shadow: rgba(0, 0, 0, .6); --overlay: rgba(10, 2, 8, .72);
  --s-g: #86c287; --s-t: #e5c26c; --s-m: #f0a46c; --s-e: #f3828c; --s-n: #b39faa; --on-seal: #1c0e18; color-scheme: dark;
}
:root[data-paleta="once"] {
  --bg: #fadcc2; --bg-hi: #fde9d7; --page: #fff6ee; --page-2: #fdeadb; --ink: #2a1520; --muted: #7a5560; --rule: #eab896;
  --rubric: #c2185b; --accent: #b0155a; --on-accent: #fff6ee; --gold: #b0155a; --init-bg: #ff5fa2; --init-fg: #2a1520;
  --focus: #b0155a; --shadow: rgba(120, 50, 40, .28); --overlay: rgba(40, 10, 20, .55);
  --s-g: #3d6b39; --s-t: #85650f; --s-m: #ac531a; --s-e: #a3162f; --s-n: #7a6266; --on-seal: #fff6ee; color-scheme: light;
}

* { box-sizing: border-box; }
body { background-color: var(--bg); background-image: radial-gradient(120% 70% at 50% 0%, var(--bg-hi), var(--bg) 70%); background-attachment: fixed; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 72px; }
.sc, label, .lbl, .eyebrow, .folno { font-family: var(--sc); letter-spacing: .06em; }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.eyebrow { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
.settings { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { font-family: var(--sc); font-weight: 700; font-size: 15px; letter-spacing: .08em; background: transparent; color: var(--muted); border: 0; padding: 4px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.swatches { display: flex; gap: 6px; align-items: center; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rule); padding: 0; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--page); }
.pal-name { font-family: var(--sc); font-weight: 600; color: var(--muted); font-size: 15px; min-width: 9ch; }
.hero { margin-top: 18px; }
h1 { font-family: var(--black); font-weight: 400; font-size: clamp(2.6rem, 7.5vw, 4.9rem); line-height: 1; margin: 0; letter-spacing: .005em; text-wrap: balance; }
h1 .cap { color: var(--rubric); }
.lede { max-width: 62ch; margin: 12px 0 0; font-size: 1.06rem; color: var(--muted); }
.fleuron { color: var(--rubric); font-size: 1.3rem; margin: 10px 0 0; line-height: 1; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
.sub { margin: 0 0 14px; color: var(--muted); max-width: 64ch; }

/* Pestanas de codice */
.tabs { display: flex; gap: 4px; align-items: flex-end; margin-top: 26px; overflow-x: auto; padding-top: 4px; scrollbar-width: thin; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 7px; font-family: var(--sc); font-weight: 700; font-size: 1.08rem; letter-spacing: .05em; text-decoration: none; padding: 8px 16px 9px; background: var(--page-2); color: var(--muted); border: 1px solid var(--rule); border-bottom: 0; border-radius: 6px 6px 0 0; position: relative; top: 1px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--page); color: var(--ink); padding-top: 11px; box-shadow: inset 0 3px 0 var(--rubric); }
.tab .count { font-size: .85rem; color: var(--rubric); }
.panel { background: var(--page); border: 1px solid var(--rule); border-radius: 0 8px 8px 8px; padding: clamp(16px, 3vw, 30px); display: grid; gap: 22px; min-width: 0; box-shadow: 0 18px 40px -30px var(--shadow); }

.alert { margin: 0; background: var(--page-2); border: 1px solid var(--rule); border-left: 4px solid var(--rubric); padding: 10px 14px; display: grid; gap: 4px; }
.alert b { font-family: var(--sc); font-size: 1.05rem; letter-spacing: .04em; color: var(--rubric); }
.alert a { color: var(--ink); text-decoration-color: var(--rubric); }
.alert a.btn { color: var(--on-accent); }
.hero .alert { margin-top: 16px; max-width: 82ch; }
.alert .row { margin-top: 6px; }
a.btn { text-decoration: none; display: inline-block; }
.notice { margin: 0; display: flex; gap: 12px; align-items: center; font-size: .95rem; color: var(--muted); font-style: italic; }

/* Controles */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 3px; min-width: 0; }
.field.grow { flex: 1 1 240px; }
label, .lbl { font-size: 15px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="url"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--page-2); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
.check { display: inline-flex; align-items: center; gap: 8px; font-family: var(--body); font-size: 14.5px; letter-spacing: 0; color: var(--ink); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--page-2); cursor: pointer; }
.check input { accent-color: var(--rubric); margin: 0; }
button { font: inherit; cursor: pointer; }
.btn { font-family: var(--sc); font-weight: 700; font-size: 16px; letter-spacing: .05em; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: 4px; padding: 8px 16px; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: default; filter: none; }
.btn-ghost { font-family: var(--sc); font-weight: 700; font-size: 16px; letter-spacing: .05em; background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 15px; }
.btn-ghost:hover { border-color: var(--ink); }
.btn-small { font-family: var(--sc); font-size: 14.5px; font-weight: 700; letter-spacing: .04em; background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 9px; text-decoration: none; white-space: nowrap; line-height: 1.4; }
.btn-small:hover { border-color: var(--ink); }
.btn-small.ok, .btn-small[aria-pressed="true"] { border-color: var(--rubric); color: var(--rubric); }
.btn-small.danger { color: var(--s-e); border-color: var(--s-e); }
.results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.results-head p { margin: 0; color: var(--muted); }

/* Folios */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px; align-items: stretch; }
.folio { background: var(--page); border: 1px solid var(--rule); border-radius: 2px; box-shadow: inset 0 0 0 5px var(--page), inset 0 0 0 6px var(--rule), 0 14px 22px -18px var(--shadow); display: flex; flex-direction: column; min-width: 0; padding: 10px; }
.panel .folio { background: var(--page-2); box-shadow: inset 0 0 0 5px var(--page-2), inset 0 0 0 6px var(--rule), 0 14px 22px -18px var(--shadow); }
.folio-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 8px 4px; }
.folno { font-size: 15px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mine, .who { font-family: var(--sc); font-size: 15px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mine-fav { color: var(--rubric); }
.mine-read, .mine-reading { color: var(--ink); }
.mine-toread, .mine-dropped { color: var(--muted); }
.who { color: var(--gold); }
.folio-body { padding: 6px 8px 8px; display: grid; gap: 10px; min-width: 0; }
.headline { display: flow-root; }
.initial { float: left; width: 3.05rem; height: 3.05rem; margin: 3px 10px 2px 0; display: grid; place-items: center; font-family: var(--black); font-size: 2.35rem; line-height: 1; background: var(--init-bg); color: var(--init-fg); border: 2px solid var(--gold); box-shadow: inset 0 0 0 2px var(--init-bg), inset 0 0 0 3px var(--init-fg); }
.title { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.title a, .title button { text-decoration: none; color: inherit; background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer; }
.title a:hover, .title button:hover { text-decoration: underline; text-decoration-color: var(--rubric); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.byline { margin: 2px 0 0; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.byline b { color: var(--ink); font-style: normal; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 0; padding: 8px 0; border-block: 1px solid var(--rule); }
.meta div { min-width: 0; }
.meta dt { font-family: var(--sc); font-size: 14px; font-weight: 600; letter-spacing: .06em; color: var(--muted); line-height: 1.2; }
.meta dd { margin: 0; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 13px; padding: 1px 9px; border: 1px solid var(--rule); border-radius: 2px; overflow-wrap: anywhere; font-style: italic; }
.chip.warn { border-color: var(--s-e); color: var(--s-e); font-style: normal; font-weight: 600; }
.seal { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sc); font-weight: 700; font-size: 15px; }
.seal b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-family: var(--sc); font-size: 15px; font-weight: 700; color: var(--on-seal); background: var(--seal, var(--s-n)); background-image: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .35), transparent 55%); box-shadow: 0 0 0 2px var(--seal, var(--s-n)), 0 0 0 3px rgba(0, 0, 0, .18), 0 2px 3px rgba(0, 0, 0, .3); }
.seal.r-g { --seal: var(--s-g); } .seal.r-t { --seal: var(--s-t); } .seal.r-m { --seal: var(--s-m); } .seal.r-e { --seal: var(--s-e); } .seal.r-n { --seal: var(--s-n); }
.seal.mini b { width: 22px; height: 22px; font-size: 13px; }
.text { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.text .lbl { display: block; color: var(--rubric); font-size: 15px; font-weight: 700; }
.text.note, .text.why { font-style: italic; }
.folio-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 8px 6px; border-top: 1px solid var(--rule); margin-top: auto; }
.foot-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.stars { color: var(--gold); letter-spacing: .08em; }
.stars .off { color: var(--rule); }
.inscr { font-family: var(--sc); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.confirm { font-family: var(--sc); font-weight: 700; color: var(--s-e); }
.empty { grid-column: 1 / -1; text-align: center; padding: 34px 16px; border: 1px dashed var(--rule); border-radius: 4px; color: var(--muted); }
.empty p { margin: 0 0 12px; }
.empty .fleuron { margin: 0 0 6px; }

.autoras ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.autoras li { background: var(--page-2); border: 1px solid var(--rule); border-left: 3px solid var(--rubric); padding: 6px 14px; display: grid; }
.autoras li a { font-family: var(--display); font-size: 1.15rem; font-weight: 700; text-decoration: none; }
.autoras li a:hover { text-decoration: underline; }
.autoras li span { font-size: 14px; color: var(--muted); }

/* Indice */
.idx-wrap { overflow-x: auto; }
table.idx { width: 100%; border-collapse: collapse; min-width: 640px; }
table.idx th { font-family: var(--sc); font-weight: 600; font-size: 15px; letter-spacing: .05em; color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 2px solid var(--rule); }
table.idx td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-size: 15px; }
table.idx tr.group td { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--rubric); border-bottom: 1px solid var(--rubric); padding-top: 18px; }
table.idx tr.group .n { font-family: var(--sc); font-size: 15px; color: var(--muted); margin-left: 8px; }
table.idx .t button { font-family: var(--display); font-weight: 700; font-size: 1.08rem; background: none; border: 0; padding: 0; color: var(--ink); text-align: left; cursor: pointer; }
table.idx .t button:hover { text-decoration: underline; text-decoration-color: var(--rubric); }
table.idx .num { font-family: var(--sc); color: var(--muted); white-space: nowrap; }

/* Recomendar */
.two-col { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 28px; align-items: start; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.req { color: var(--rubric); }
.steps { margin: 0; padding-left: 1.5em; display: grid; gap: 6px; }
.steps li::marker { font-family: var(--sc); font-weight: 700; color: var(--rubric); }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
pre.scroll { margin: 0; font-family: var(--body); font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--page-2); border: 1px dashed var(--rule); border-radius: 3px; padding: 12px; max-height: 220px; overflow: auto; }
details summary { font-family: var(--sc); font-weight: 600; color: var(--muted); cursor: pointer; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.err { color: var(--s-e); font-weight: 600; margin: 0; }
.okmsg { color: var(--s-g); font-weight: 600; margin: 0; }

/* Escriba */
.box { background: var(--page-2); border: 1px solid var(--rule); border-radius: 4px; padding: clamp(14px, 2.5vw, 22px); display: grid; gap: 12px; min-width: 0; }
.box input[type="text"], .box input[type="url"], .box input[type="number"], .box select, .box textarea { background: var(--page); }
.pend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pend li { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.pend a { font-size: 14px; overflow-wrap: anywhere; min-width: 0; flex: 1 1 260px; }
.savebar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin-top: 16px; background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; box-shadow: 0 14px 28px -12px var(--shadow); }
.savebar p { margin: 0; font-weight: 600; }
.savebar .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.savebar .btn-ghost { color: var(--on-accent); border-color: var(--on-accent); }

/* Folio en detalle */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.sheet { width: min(760px, 100%); max-height: 100%; overflow: auto; background: var(--page); border: 1px solid var(--rule); box-shadow: inset 0 0 0 6px var(--page), inset 0 0 0 7px var(--rule), 0 30px 60px -20px var(--shadow); padding: clamp(18px, 4vw, 34px); display: grid; gap: 14px; }
.sheet .kicker { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sheet .initial { width: 4.4rem; height: 4.4rem; font-size: 3.5rem; }
.sheet .title { font-size: clamp(1.7rem, 4vw, 2.3rem); }
.sheet .meta { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.rel h3 { font-family: var(--sc); font-weight: 700; font-size: 1.05rem; letter-spacing: .05em; color: var(--rubric); margin: 0 0 4px; }
.rel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.rel button { background: none; border: 0; padding: 2px 0; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 1.1rem; text-align: left; cursor: pointer; }
.rel button:hover { text-decoration: underline; text-decoration-color: var(--rubric); }
.rel span { color: var(--muted); font-style: italic; font-size: 14px; }
.rels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
.sheet .box { background: var(--page-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cuenta regresiva de AO3 */
.eta { display: grid; gap: 3px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--rule); }
.eta-h { font-family: var(--sc); font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.eta-date { font-family: var(--display); font-weight: 700; font-size: 1.4rem; line-height: 1.15; }
.readvia { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.readvia .lbl { font-size: 14px; }
.eta-line { font-style: italic; font-variant-numeric: tabular-nums; }
a.author { color: var(--ink); font-weight: 700; font-style: normal; text-decoration: underline; text-decoration-color: var(--rule); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a.author:hover { text-decoration-color: var(--rubric); }
table.idx a.author, table.idx td b { font-weight: 400; }
a.who { text-decoration: none; }
a.who:hover { text-decoration: underline; }
.candle { position: relative; height: 8px; border-radius: 4px; background: var(--rule); margin-top: 8px; }
.candle .burn { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--rubric); }
.candle .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.candle-l { display: flex; justify-content: space-between; gap: 10px; font-family: var(--sc); font-size: 14px; color: var(--muted); }
.eta-note { font-size: 13px; color: var(--muted); font-style: italic; }
/* Filtros plegables y etiquetas */
.searchbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filters-btn { display: inline-flex; align-items: center; gap: 8px; }
.searchbar input[type="text"], .searchbar input[type="search"], .searchbar .filters-btn { height: 42px; }
.searchbar .filters-btn { padding-block: 0; }
.fcount { font-family: var(--sc); font-weight: 700; min-width: 1.5em; height: 1.5em; padding: 0 .4em; border-radius: 999px; background: var(--rubric); color: var(--page); font-size: 14px; line-height: 1.5em; text-align: center; }
.fcount:empty { display: none; }
.filters { display: grid; gap: 14px; padding: 14px; border: 1px solid var(--rule); background: var(--page-2); border-radius: 4px; }
.filters .check, .filters select { background: var(--page); }
.trope-filter { display: grid; gap: 6px; }
.trope-filter .chips { gap: 6px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.active-filters:empty { display: none; }
button.chip { background: transparent; color: inherit; font-family: var(--body); cursor: pointer; line-height: 1.55; }
button.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--rubric); border-color: var(--rubric); color: var(--page); font-style: normal; }
.chip.x::after { content: " \00d7"; font-style: normal; }
.tagbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--page-2); cursor: text; min-height: 42px; }
.box .tagbox { background: var(--page); }
.tagbox:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.tags { display: contents; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 1px 2px 1px 9px; border: 1px solid var(--rubric); color: var(--rubric); border-radius: 2px; font-size: 14px; font-style: italic; }
.tag-x { background: none; border: 0; color: inherit; font-size: 17px; line-height: 1; padding: 0 5px; cursor: pointer; font-style: normal; }
.tagbox input.tag-in { flex: 1 1 140px; width: auto; min-width: 120px; border: 0; background: transparent; padding: 4px 2px; }
.tagbox input.tag-in:focus { outline: none; }
.hint { font-size: 13px; color: var(--muted); font-style: italic; }

body { background-image: radial-gradient(120% 70% at 50% 0%, var(--bg-hi), var(--bg) 70%); }
h2 { font-family: var(--black); font-weight: 400; font-size: 1.85rem; line-height: 1.1; letter-spacing: .01em; }
.hero .fleuron { display: flex; align-items: center; gap: 14px; max-width: 420px; font-size: 1.1rem; color: var(--gold); }
.hero .fleuron::before, .hero .fleuron::after { content: ""; flex: 1 1 auto; height: 1px; background: linear-gradient(90deg, transparent, var(--rule)); }
.hero .fleuron::after { background: linear-gradient(90deg, var(--rule), transparent); }

.btn, .btn-ghost, .btn-small, .check, .seg, .box, .filters, .tagbox, .chip, .tag, .tab, .panel,
input[type="text"], input[type="url"], input[type="search"], input[type="number"], input[type="date"], select, textarea { border-radius: 0; }
.tab[aria-current="page"] { box-shadow: inset 0 2px 0 var(--gold); }
.panel { box-shadow: 0 20px 44px -36px var(--shadow); padding: clamp(20px, 3.4vw, 34px); }

/* Marcos: una linea fina y una filigrana dorada en cada esquina */
.folio, .panel .folio, .sheet, .alert { position: relative; border: 1px solid var(--rule); border-radius: 0; box-shadow: 0 1px 0 var(--rule), 0 16px 28px -22px var(--shadow); }
.folio, .sheet, .alert, .panel { background-image: var(--grain-strong), var(--foxing), radial-gradient(140% 110% at 50% 40%, transparent 58%, rgba(110, 70, 20, .16)); background-size: auto, auto, 100% 100%; }
.folio { background-color: var(--page); padding: 24px 24px 20px; }
.panel .folio { background-color: var(--page-2); }
.sheet { background-color: var(--page); padding: clamp(32px, 4.5vw, 44px); }
.alert { background-color: var(--page-2); padding: 28px 30px; }
.folio::before, .sheet::before, .alert::before { content: ""; position: absolute; inset: 5px; pointer-events: none; background: var(--gold); -webkit-mask: var(--frame); mask: var(--frame); }
.folio.cs-1::before, .sheet.cs-1::before { -webkit-mask: var(--fr1); mask: var(--fr1); }
.folio.cs-2::before, .sheet.cs-2::before { -webkit-mask: var(--fr2); mask: var(--fr2); }
.folio.cs-3::before, .sheet.cs-3::before { -webkit-mask: var(--fr3); mask: var(--fr3); }
.folio.cs-4::before, .sheet.cs-4::before { -webkit-mask: var(--fr4); mask: var(--fr4); }
.folio.cs-5::before, .sheet.cs-5::before { -webkit-mask: var(--fr5); mask: var(--fr5); }
.folio.cs-6::before, .sheet.cs-6::before { -webkit-mask: var(--fr6); mask: var(--fr6); }
.folio.cs-7::before, .sheet.cs-7::before { -webkit-mask: var(--fr7); mask: var(--fr7); }
.alert b { font-family: var(--black); font-weight: 400; font-size: 1.6rem; letter-spacing: 0; line-height: 1.1; }

.folio-head { position: relative; padding: 0 4px 10px; margin-bottom: 6px; background: linear-gradient(var(--rule), var(--rule)) left bottom / calc(50% - 12px) 1px no-repeat, linear-gradient(var(--rule), var(--rule)) right bottom / calc(50% - 12px) 1px no-repeat; }
.folio-head::after { content: "\2766"; position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 50%); color: var(--gold); font-size: 13px; line-height: 1; }

":null,"len":"One-Shot","r":"E","tr":"","wa":"","sc":0,"no":"","ab":"","w":"","by":"","d":"2026-09-26"},{"id":"r23","n":23,"t":"Queen of hearts","l":"https://archiveofourown.org/works/72587011","a":"Jihyokitty","f":"Twice (Band)","s":"2yeon","st":"Completed","m":"Favorite","ch":15,"len":"Largo","r":"T","tr":"","wa":"","sc":5,"no":"Such a good 2yeon fic!","ab":"","w":"","by":"","d":"2026-09-26"},{"id":"r24","n":24,"t":"SCHEDULE","l":"https://archiveofourown.org/works/53918806","a":"Myouiim","f":"Twice (Band)","s":"Miyeon","st":"In Progress","m":"To read","ch":1,"len":"Corto","r":"E","tr":"","wa":"","sc":0,"no":"","ab":"","w":"","by":"","d":"2026-09-26"}],"autoras":[{"a":"Jihyokitty","l":"https://archiveofourown.org/users/Jihyokitty/pseuds/Jihyokitty/works?fandom_id=7150409","f":"Twice (Band)","works":19}],"pendientes":[],"meta":{"updated":"2026-11-01","contacto":"ImBabyLilith","ao3Down":true,"ao3Since":"2026-10-29T07:13:00Z","ao3From":"2026-11-13T12:00:00Z","ao3To":"2026-11-27T12:00:00Z"},"adelanto":{"on":true,"fic":"Medieval MiChaeng","cap":"Chapter 7 — “Bryndell”","lang":"en","borrador":true,"link":"","nota":"","texto":"It was the breathing that woke her.\n\nSlow and soft, and very close, and certainly not her own. Chaeyoung lay with her eyes shut and her face buried in something that smelled of jasmine, and understood, one piece at a time, that the pillow she was holding was breathing too.\n\nHer eyes snapped open.\n\nBlack hair. A great deal of it, spread across the pillow and over her sleeve, dark as ink even against the first light of morning coming through the window behind it. And under the hair, tucked against her chest as if she had always been there, the Third Princess of Twiceland lay fast asleep in her arms.\n\nOh no.\n\nChaeyoung's heart turned over, violently.\n\nEvery part of her wanted to be out of that bed and on the far side of the room. But something stronger held her where she was. Because Mina was asleep. Mina, who had not gone to sleep until very late last night, frightened of being left alone in the dark of that room, and who now, in the peace of first light, lay serenely asleep in her knight's arms. With no worry in her, and no dread, and no fear at all. Chaeyoung would sooner lose the arm than wake her now.\n\nHer arm, for its part, had an opinion of its own.\n\nThe pain came up slowly, a hot line climbing from her left elbow to her shoulder and settling there, patient as a creditor who had waited all night for the debtor to open her eyes. Below the elbow she could not feel the arm at all. Above it, she felt far too much. Tzuyu's stitches, sewn fresh last night in complete silence with her mouth pressed flat, pulled and burned across the lieutenant's shoulder.\n\nThe knight tried not to think too hard about the pain, and tried harder not to move suddenly.\n\nChaeyoung tried to put the night back together and found only pieces. She remembered sitting against the headboard, fully dressed and on top of the covers, in a posture she could have defended before a disciplinary tribunal, if a tribunal for this had ever existed. Then she remembered Hwaren. Sheep tearing at the grass on a hillside painted blue, a tree on the rise, and a small girl running along beside her. She remembered perfectly well thinking just a minute.\n\nShe did not remember lying down at all. And she certainly did not remember gathering a princess into her arms.\n\nNobody had decided this. Or perhaps the two bodies had decided it on their own, somewhere between the second bell and now, without troubling to consult either of the people inside them.\n\nThe light of the sunrise went on climbing, and from where she lay Chaeyoung could see most of the room without lifting her head, and by day it looked like somewhere else entirely. The north wing had no stained glass and no windows angled to flatter the portraits of ancestors. Here the light came in straight, and with a kind of grace. It travelled the whole room with perfect confidence, turning little by little from a bluish cast to a bright gold, lighting the hardened wax beside the candlestick, the furniture Chaeyoung had set right the night before, and on the wall, climbing from the window frame toward the ceiling, thin as a hair, the crack.\n\nFour hundred years of stone, split open like a seam.\n\nOn the nightstand, the three books still sat stacked by size. Chaeyoung had squared those herself last night as well, without reading the titles, trying to give the princess an orderly, quiet room to wake up in after what had happened.\n\nIt's morning...\n\nThe thought arrived late and brought its consequences with it. Nayeon had told her sister she would come in the morning, and Nayeon always came when she said she would, with a punctuality her councillors called a virtue and her sisters called other things. And outside, one door away, stood two guards Chaeyoung had helped post there herself.\n\nThe knight lifted her good hand to ease herself free.\n\nAnd stopped, with the hand in the air and, very quickly, no intention at all of using it, looking at the princess.\n\nBecause Mina was truly asleep. No posture, no careful protocol, none of the layers she put on every morning before she let the world look at her. Her jaw loose, her brow smooth, her lips a little parted, her breathing deep. All the composure of Twiceland melted against her guard's shirt, and not troubled in the slightest by the contradiction.\n\nChaeyoung, who was beginning to feel something strange in her chest, let herself look.\n\nShe had never given herself the time to look at her properly, and never anywhere near this close. The knight had looked at her in the library, where the princess sat across a table behind a wall of books. Or on the terrace, where the candle was always between them and the night softened everything at the edges. But like this? With nothing between them but a breath? Never.\n\nMina's lashes were longer than she had realized, dark against her cheek, and every so often they moved very slightly, as if she were reading something in her sleep. The pillow had pressed a faint crease into the skin beside one eye. A small mole above her lip, which Chaeyoung's eyes went past quickly, and another on the bridge of her nose. Along the edge of her jaw ran a thin pale scar Chaeyoung had never noticed before, fine as thread and very old. Some fall in childhood, maybe, from before anyone had decided the Third Princess must never fall again. And a single strand of hair, caught at the corner of her mouth, stirring with every breath.\n\nChaeyoung wanted to move it. Badly.\n\nBut she didn't. She lay there with her good hand still lifted uselessly in the air, a finger's width from that strand, and looked. At the curve of Mina's ear. At the small pulse beating slow and even in the hollow of her throat. At her mouth, softer than it ever was awake. And it came to Chaeyoung, slowly and with some terror, that she was memorizing every detail. Reading the ground with the same care she gave ground before a fight, every stone and every angle, so that later, in the dark, she could cross it again without a light.\n\nIn the drawings she kept at the bottom of her trunk, Mina's face was always in profile, always from across a room, and always a little wrong around the mouth. Now she understood why. She had never been close enough to get it right.\n\nChaeyoung did not understand where the impulse came from. This pull, slow and perfectly sure of itself, that never seemed to settle unless she was at the princess's side.\n\nOnly a few hours ago, this same woman had sat in this bed with her eyes open in the dark, afraid to let go of her shirt. Afraid to be alone.\n\nThe knight lowered her hand.\n\nThat was when she noticed the warmth.\n\nMina's palm rested against her ribs, over the cloth of her shirt, and it was warmer than any hand under a blanket had reason to be. The heat had a pulse, very faint, rising and falling with Mina's breathing, and it never grew. It simply stayed, steady, an ember that had found its size and saw no reason to look for another, and very much like the thing Chaeyoung felt in the center of her own chest.\n\nLast night that same warmth had thrown two grown women across this room.\n\nChaeyoung knew she ought to be afraid of it. But she wasn't, and that was the part she could not make sit right, the part that had turned over and over in the dark of the antechamber until Mina said her name.\n\nThen the breathing against her shoulder changed.\n\nA small change. Fingers closing a little on her shirt. A foot shifting under the blanket. Chaeyoung went perfectly still, with the foolish hope that stillness might put things off a while longer.\n\nAnd the other breathing stopped altogether.\n\nChaeyoung felt it happen. Felt Mina wake all at once and understand where she was, and go rigid in her arms like a hare in long grass. For one long moment, neither of them breathed.\n\nVery slowly, Mina lifted her head.\n\nTheir eyes met across the pillow. Mina's were wide and dark and not the least bit asleep, and Chaeyoung watched the color climb from her throat to her cheeks to the very tips of her ears.\n\n\"Oh,\" Mina said. It was barely a sound.\n\n\"Good morning, Your Highness.\"\n\nIt was the only thing Chaeyoung could think of. It came out perfectly calm, as if she woke beside princesses every day of the week, and Mina stared at her as though she had spoken in a foreign language.\n\n\"I...\" Mina looked down at her own hand, still spread flat against Chaeyoung's ribs, and took it back as if it belonged to someone else. \"I didn't... I don't know how I...\"\n\n\"Neither do I,\" said Chaeyoung. \"If that helps.\"\n\nIt did not seem to help. Mina sat up too quickly, the blanket sliding off her shoulder, and pushed her hair back with both hands, and then did not seem to know what to do with them at all. She folded them in her lap. Unfolded them. She looked at the window, at the crack, at the furniture, anywhere but at the woman lying beside her.\n\nThat was when her eyes found the arm.\n\nChaeyoung watched her follow it. From the pillow where her own head had rested, to the elbow, to the shoulder, to the left side of Chaeyoung's body and the dark line of stitches under the linen, faintly stained with red. Every trace of color went out of her face at once.\n\n\"Your shoulder!\"\n\n\"It's fine.\"\n\n\"That's the arm. That's the one the healer...\" Mina's fingers came up to her mouth. \"I slept on it. All night. Blessed Solenne. Chaeyoung, I'm so sorry.\"\n\n\"You don't need to…\"\n\n\"I'm sorry. I didn't know I had. I would never have...\"\n\n\"Your Highness.\" Chaeyoung pushed herself up to sitting. The shoulder protested at once with a white flash that ran up her neck and blurred half the room, and she took it with the same face she had spent twelve years practicing for exactly this. Trying not to let it show. \"Look at me.\"\n\nMina looked. Barely, through her hands, which were covering her face in shame.\n\n\"I've slept on rocks. On horseback. And once standing up in the rain, on a wall in the southeast, with a troll on the other side of it.\" Chaeyoung kept her voice easy. \"I think last night was the best I've slept in months.\"\n\nIt was true. She had not meant to say that part out loud.\n\n\"With respect, Your Highness,\" she added a few seconds later.\n\nThe corner of Mina's mouth trembled, not quite toward a smile. \"You're only saying that.\"\n\n\"I don't say things I don't mean. You can ask the captain. She says it's my worst quality.\"\n\n\"I'm still sorry,\" the princess whispered again.\n\n\"I know.\" Chaeyoung held her eyes, as gently as she knew how. \"And I'm telling you there's nothing to be sorry for. You were frightened and you asked for my help. I only did as I was asked. There's nothing to forgive in a woman doing her job.\"\n\nMina looked at her for a long moment with her hands knotted in her lap, and her face said plainly all the things Chaeyoung would never admit.\n\n\"Her Highness asked her guard to remain in the room, and her guard did her duty,\" Chaeyoung added.\n\n\"Of course...\" The princess seemed to be making her peace with the version of reality the other woman was setting out in front of her, and trying to keep some dignity in the situation.\n\nAnd in the corridor, on the other side of the door, footsteps stopped.\n\nChaeyoung was off the bed before the knock came. Her boots stood where she had left them, by the headboard, and there was no time for them. She reached the foot of the bed in her stockings and crossed the princess's room in a few strides, slipping silently into her own, her good hand on her sword belt, and behind her she heard Mina pull the blanket up and sit against the pillows with a composure that had been built in the space of a breath.\n\nFaint voices were heard in the corridor, followed by the heavy door opening.\n\nCrown Princess Nayeon came in already dressed for the day, her hair pinned, her face pale beneath powder that did not quite hide the night she had spent. Her eyes went straight to her sister and stayed there. They moved over Mina's face, her hands, her shoulders, as they did every morning now, asking the same silent question. Is she whole?\n\nOnly then did they go to the crack in the wall. And only after that, to the lieutenant's antechamber door, now closed.\n\n\"Good morning, Mina.\" She greeted her sister gently and sat on the edge of the bed, where seconds earlier her guard had been.\n\n\"Good morning, sister.\" The younger one greeted her back, pulling the blanket up to her shoulders.\n\n\"Did you sleep well?\" Nayeon asked, getting up again and crossing to the window. Mina let out a breath of relief.\n\n\"It was a quiet night, yes.\" The color came up in her cheeks. The memory of waking in Chaeyoung's arms arrived all at once.\n\n\"I can see that. I'm glad you managed to sleep after everything.\" Nayeon came back to her and looked at her with relief, and with something Mina knew perfectly well as affection.\n\nNayeon smoothed her hair lightly, combing out what the pillows had tangled, and smiling with great tenderness, said, \"I have good news for you.\"\n\nMina did not know what to answer, so she chose to go on listening.\n\n\"Your chambers in the royal wing will be ready by noon,\" she told her. \"The servants are airing them now. You can move back today.\" And then, \"What do you think?\"\n\nMina was genuinely happy to be going back to her room, to her real room. But her head may have been occupied with other, more important matters, and her face gave it away at once.\n\n\"What is it? Aren't you happy about this?\" Nayeon's voice brought her back down, and she remembered where she was and who she was with.\n\n\"No, of course I'm happy!\" Mina said immediately.\n\n\"Are you sure? Because if you'd rather stay here, that can be arranged too,\" Nayeon said.\n\n\"There's no need. I really am happy to be going back to my own room. Thank you, Nayeon.\" And finally, with a face that settled the matter for her sister, the heir seemed satisfied with the answer.\n\n\"I can't imagine a better way to wake up,\" Nayeon finished, with the humor she so rarely let anyone see.\n\nMina only nodded. Heat crawled once more from her neck.\n\nThe princess could feel heat rising from her neck to her cheeks, and she let out a deep sigh, trying to steady her nerves.\n\n\"Indeed...\" Mina said softly, casting a sidelong glance toward the closed door of the antechamber.\n\n\"Very well, then. I shall see you later. I have several matters to attend to before noon,\" Nayeon said at last, giving her sister a brief embrace, a gesture that was something new. \"I hope you have a wonderful day, sister.\"\n\nAnd just as quickly as she had arrived, the Crown Princess took her leave.\n\n---\n\nBy the time the sun had been up two hours, Nayeon had been awake for three.\n\nShe had not slept, or at least not properly. She had stayed in bed after the meeting with her captain, closed her eyes, and spent the hours that followed in that middle state where the body rests and the mind keeps working. Going back over decisions, anticipating consequences, drafting in her head a letter she still had not put on paper. The letter to her great-grandmother. That mysterious woman who seemed to know everything and everyone, and of whom Nayeon sometimes felt she knew almost nothing. Every sentence she built sounded like defeat, and each time she threw it out and began again, the crack in the north wing wall appeared behind her eyelids to remind her that the defeat had already happened and the letter was only the record that made it official.\n\nBy six she was up and dressed. She studied herself in the mirror with the clinical attention a tool gets before it is used. The right dress, her hair in place, a face that would not let anyone see that inside, the heir of Twiceland was holding too many things with too few hands. Satisfied with the surface, she went down to her study.\n\nNayeon was used to this routine. To working long hours without stopping. To solving problems the moment they appeared, and to thinking about the problems that might appear later. Day and night. Her work was for the kingdom, because eventually the kingdom would be hers. It was the only thing she truly owned, and every so often, when her own mind betrayed her and ran out of tasks to put its attention on, even the idea of an entire kingdom under her command felt insignificant. Empty. Not because Nayeon wanted more. The opposite. Sometimes she wanted less. Simple things, like sitting how she wanted to sit, speaking how she wanted to speak, being with the person she wanted to be with. Is this really what your heart wants? Is this really all you are? All you can be? She truly wished it were not. But wishing alone would not take her anywhere, and nobody knew that better than Nayeon.\n\nKnock, knock.\n\n\"Come in.\"\n\nThe door opened and what came in was the smell of smoke, of hay, and of something Nayeon could have recognized anywhere in the world. The smell of the stables that Jeongyeon wore in her clothes like a second skin, as much a part of her as the dry humor and the hands cracked from the reins.\n\nJeongyeon came in with the ease of long habit. She had made this same walk more times than either of them could count and knew exactly how many steps there were between the door and the point where protocol required her to stop. She bowed, correct and very brief. Nayeon let herself give a small smile at the stiff, very badly practiced bow. It was no secret that Jeongyeon knew how to respect the forms and had never once found a reason to enjoy them.\n\n\"Your Highness. I've come to report on the state of the stables,\" Jeongyeon announced, rubbing her hands together nervously.\n\nNayeon set her pen down on the desk. The kingdom could wait a little longer.\n\n\"Of course. You have all my attention,\" Nayeon said, breathing in carefully the familiar smell that was filling the room.\n\nThe princess watched Jeongyeon take a folded paper out of her vest pocket, stained in one corner with something that might have been ink or might have been mud, and consult it gravely, as though she were presenting a war briefing instead of a damage inventory.\n\n\"The fire took the eastern half of the structure. Ten stalls destroyed, five more with partial damage. The roof over the main section needs replacing entirely. The one over the secondary section decided to replace itself, so in a way it saved us the trouble.\" The pause was millimetric, timed for the punchline. \"Fortunately, no animal was hurt. Although I did have to carry Flint. He has the survival instinct of a rock.\"\n\n\"You carried a horse?\" the princess asked, slightly worried by the other woman's words.\n\n\"I pushed him. With great insistence and very little dignity. But technically yes, I carried him part of the way,\" the stable master answered.\n\nNayeon laughed.\n\nIt was short, and it got out without asking her. Habit tried to put it away the moment she heard it. In front of the council she would have pressed her lips flat until the urge went off on its own, and she had done exactly that a thousand times, with nobles and with ambassadors and with every person who had ever come into this office to ask her for something. But there was nobody here to make a note of the fact that the heir of Twiceland found a story about a sleeping horse funny.\n\nSo she let it out. And then she let it stay.\n\nJeongyeon's shoulders came down a little when she heard it. She had not come for that. She took it anyway.\n\n\"I see. What's the estimate on the repairs?\"\n\n\"Two weeks for the structural work, with the carpenters we have. A month if you want it looking the way it did.\" A pause. \"My recommendation is that it ends up better than it did. The stables have been asking for a renovation for years and nobody approves it because horses don't vote on the council.\"\n\n\"Then consider it done.\"\n\n\"Really?\" Nayeon held her breath when she saw the woman in front of her light up.\n\n\"Consider it done, Jeongyeon. I'll take it to the treasury.\"\n\nJeongyeon looked at her a second longer than she needed to. With that attention of hers, simply present, searching something dear for cracks and unable to stop.\n\nAnd she found them.\n\nNayeon knew because she saw Jeongyeon's eyes narrow a millimeter, saw her weight shift slightly forward, the involuntary move of wanting to come closer and stopping before the wanting turned into a step. Jeongyeon saw what nobody else saw. The shadows under the powder. The set of her jaw, tighter than a crisis alone could explain. Her fingers closed too hard around the pen, as if she needed to squeeze something so she would not let go of everything else.\n\nAnd right then Nayeon remembered why, to a certain degree, she hated meeting with Jeongyeon alone.\n\n\"Your Highness...\" The stable master's low, soft voice carried across the room.\n\n\"Yes?\"\n\n\"How many hours did you sleep?\" she asked at last.\n\nThe question crossed the distance between them like something that should never be said. Jeongyeon had no right to ask it. A stable master does not ask the heir how many hours she slept. But Jeongyeon had never been very good with rights she did not have. She used them anyway, easily, with no idea how to live another way.\n\nNayeon could lie. She was good at lying. Her whole life was an exercise in saying the right thing at the right moment with the right face. But lying to Jeongyeon was like trying to lie to a mirror. It did not fail because Jeongyeon caught her. It failed because a lie could not survive contact with the one person who had known her before the crown.\n\n\"Enough.\"\n\n\"So, none,\" the stable master said.\n\n\"Jeongyeon.\"\n\n\"I know, I know. It's not my place.\"\n\nThe phrase fell between them with the weight of something repeated so often that it had worn its own groove in the conversation. It's not my place. The phrase Jeongyeon used as a wall, as a shield, as the distance she laid down herself every time crossing it would have meant something neither of them could afford.\n\nNayeon closed her eyes for a few seconds. Something she would never have allowed herself with Jihyo, or with Sana, or with the council, or with anyone who was not this person standing in front of her desk smelling of smoke and hay and everything Nayeon wanted and could not have.\n\n\"It was a difficult night,\" she said. And it was the most honest thing she had said since dawn.\n\nJeongyeon did not ask why. She did not ask what happened, or how can I help, or any of the things people ask when someone admits to a bad night. What she did was stay. A moment longer than the report required, a moment longer than protocol allowed, a moment that existed outside the rules because the rules had no room for what the two of them were.\n\n\"The stables will be ready,\" Jeongyeon said softly. As though she were talking about stables and not about something larger. \"Anything that breaks can be mended. It only needs time, and somebody willing to do the work.\"\n\nNayeon opened her eyes. Jeongyeon was looking at her with the face that disarmed her every single time. The same one from back when they were only two young women. It was the face that loved without conditions and lived by the single condition of never being able to show it.\n\nThe distance between them was a desk. A year and a half of polished wood. Nayeon's hands on the surface, her knuckles white around the pen. Jeongyeon's hands at her sides, open, a little restless, held still by years of learning to keep her posture.\n\nNayeon took a moment to look at her properly, head to foot. However many years went by, she was certain this woman would stay exactly as irreverent toward the laws of the crown, and exactly as firm about her own limits.\n\nAnd then it was Jeongyeon who stepped back.\n\nGently, a practiced gesture closer to reflex than to choice. Half a step, shoulders squaring, the smile coming back with its edges a little worn. An elegant retreat. She loved enough to leave, and it broke her a little every time.\n\n\"I should get back to the stables.\" The professional voice returned, like armor closing. \"The roof won't mend itself. And somebody has to explain to Flint that fires are not something you sleep through.\"\n\nNayeon nodded. The heir back in place as well. The two people they were in public covering the two people they were in private, efficiently, as if it were a matter of changing shoes.\n\n\"Thank you for the report, Jeongyeon. It really was good to see you.\"\n\n\"The pleasure was mine, Your Highness.\"\n\nJeongyeon turned toward the door and opened it with some hesitation. And in the doorway, half turned, with the corridor light drawing one side of her face and leaving the other in shadow, she said, \"My princess. Take care of yourself, please. The kingdom needs you whole.\"\n\nThe sentence stayed in the room after the door closed. It stayed the way things stay when they mean more than they say. In the air, in the wood of the desk, in the space between the door and Nayeon's heart.\n\nThe princess breathed in deeply. You have to concentrate. And she turned back to her work. To the letter to her great-grandmother. She picked up the pen, with purpose, and wrote the first line.\n\nHer hand did not shake. But she held it tighter than before, because a single sentence had made her remember what she tried to forget every morning. That underneath the obligations and the endless tasks, underneath the crown, underneath everything she carried, there was a woman who wanted someone to tell her she did not have to be whole all the time.\n\nAnd the only person who ever told her so was the one who always left.\n\n---\n\nAcross the castle, the return to the royal wing was a matter of trunks and silences.\n\nThey had not brought much to the north wing. The move there had been quick and practical, clothes and books and the few things a princess needs to live in rooms that are not hers. But things spread when a person stays longer than planned. By noon Chaeyoung had found Mina's favorite teacup on a nightstand, a cloak over the back of a chair, a candle stub on the windowsill burned down to the dish. And on every flat surface, more books stacked by size with their spines squared to the edge, because Mina could no more leave a pile crooked than Chaeyoung could.\n\nThe servants took the trunks and Mina kept one bag.\n\nShe opened the wardrobe while Chaeyoung waited in the doorway with her back to the room and her eyes on the corridor. The knight heard cloth unfolding. The whisper of old paper. Cloth again, and then a sound she remembered from a dark night in the library, three heavy books settling against each other.\n\n\"I'm ready,\" the princess said a few seconds later behind her. Chaeyoung turned, and without asking, took the bag with the last of Mina's belongings out of her arms.\n\nIt was heavier than cloaks had any right to be. Two of them folded on top, and a shawl, and under those a weight that sat square and hard against Chaeyoung's hip. She shouldered it on the good side and did not look inside.\n\nHer left arm was in a fresh bandage. Tzuyu had changed the dressing an hour earlier in the infirmary, and had not said a word the second time either. Chaeyoung had tried twice to start a conversation and given up when Tzuyu pulled the last knot tight enough to answer both attempts.\n\nThey walked the corridors. Mina ahead, Chaeyoung a step behind with the bag on her shoulder and her sword at her hip. Servants pressed themselves to the walls to let them pass and turned to watch them go. By now the whole castle had heard some version of what had happened in the north wing, and every version was wrong.\n\nThe royal wing smelled of beeswax and polished oak. Mina's chambers were exactly as she had left them, give or take the stain on the floor and the intruders who had put it there. The sheets had been changed for clean ones, there were new candles, and the window stood open on the gardens. Chaeyoung went in first and made the quick, routine inspection the princess seemed more than used to by now. A few moments later she stepped back out into the corridor and waited for Mina to go in on her own.\n\nMina stopped in the middle of the room and looked around for a long time, and Chaeyoung could not tell what she was seeing. The same walls. The same bed. And that was when the knight understood. The last time Mina stood here, her hands had never lifted anything heavier than a book.\n\nThen she turned. \"Would you wait outside?\" the princess asked.\n\nChaeyoung set the bag on the bed and went out without asking anything. She closed the door behind her and stood in the corridor with her back to it, feet apart, good hand on the pommel, watching the tapestry across the hall as if it might attack.\n\nBehind her the room made small sounds. A drawer. Something wooden that gave with a click. And then a long pause. Footsteps crossing to the far wall, and back again. Chaeyoung caught herself counting them and stopped. She fixed her eyes on the tapestry, a hunting scene with a stag that had too many points, and studied the stag with enormous attention until the door opened.\n\n\"Done,\" the princess announced.\n\nThe bag lay empty on the bed, the two cloaks hung in the wardrobe, and the shawl was over a chair. The room looked exactly as it had a quarter of an hour ago, and Chaeyoung could not have said, if her life depended on it, where three books the size of paving stones had gone.\n\nShe did not look for them either, and of course, Mina noticed.\n\n\"You're not going to ask?\" Mina said, watching the younger woman closely.\n\n\"No, Your Highness,\" she answered simply.\n\n\"Why not?\" The princess's voice was genuinely curious.\n\n\"If anyone ever asks me, I'd like to be able to say I don't know.\" Chaeyoung shrugged with the good shoulder. \"I'm a terrible liar. It would be all over my face before they finished the question.\"\n\nMina considered that with her head a little to one side. Something eased at the corner of her mouth. \"That's very sensible.\"\n\n\"I have my moments.\"\n\n---\n\nThe antechamber in the royal wing was larger than the one in the north. A proper bed instead of a cot, though Chaeyoung could see from the doorway that it would still be too short for her. A small table. A hook on the wall for her sword. A pitcher of water already set out, because the servants of the royal wing anticipated things the servants of the north wing had never known needed anticipating. Her trunk stood at the foot of the bed, and she checked the lock before anything else. The drawings were still at the bottom, under her winter shirts and beside her father's sword, carefully wrapped in a sheet.\n\nAnd the door.\n\nPlain oak, between the antechamber and Mina's bedchamber, with an iron latch on Chaeyoung's side. Closed. The correct position. Guard here, princess there.\n\nChaeyoung looked at it for longer than a door deserved. Then she hung up her sword and set about finishing her check of the room. The carved wooden tiger was still in its place, along with some letters she barely remembered, letters she had promised Jihyo she would go through.\n\n---\n\nThe evening went by in small things.\n\nThey had supper on the terrace, brought up on trays and eaten face to face. They did not stay long. Not long after they finished, the princess insisted on going back to her room, and the knight did not question what the princess wanted.\n\nAnd now Mina read while Chaeyoung checked the window latches twice, the corridor once, and stepped briefly out of the room to see the change of the guard at the ninth bell. When she came back in, the princess was already dressed for bed, but looked deeply absorbed in whatever she was reading. Chaeyoung stayed with her a little longer. Twice she caught Mina looking at her over the top of the book, and twice Mina looked down again so quickly that Chaeyoung pretended not to have seen.\n\nBy the time the candles had burned down a finger's width, there was nothing left to check and no reason to stay in the princess's room any longer.\n\n\"Good night, Your Highness,\" Chaeyoung said.\n\nShe bowed at the door to the antechamber and put her hand on the latch. She had spent the whole evening telling herself, with great firmness and conviction, that last night had been an emergency, that emergencies do not repeat themselves, and that she was going to sleep in her own bed like a decent lieutenant of the royal guard.\n\n\"Wait.\"\n\nAnd Chaeyoung stopped at once.\n\nThe princess sat on the edge of the bed in her nightgown, a shawl around her shoulders and her hands in her lap, the book forgotten on the nightstand while she looked at her own hands nervously. Her thumb pressed into the center of her palm and moved in slow circles, and Chaeyoung had watched her do that enough times now to know what it meant.\n\n\"Could you...\" Mina stopped, and started again, to her hands. \"Would you stay? Here. The same as last night.\"\n\nThe latch was cold under Chaeyoung's fingers.\n\n\"Your Highness...\"\n\n\"I know.\" The color was coming up in her face again, the same as that morning. \"I know what I'm asking. I know it isn't your duty. It's only that when I close my eyes, I don't know what I'll see. And if I see it, I don't know what my hands will do.\" Her thumb went still. \"Last night they didn't do anything. Once you were there.\"\n\nChaeyoung should say no. There were a dozen reasons, and she knew every one of them by heart. She started with the easiest.\n\n\"There are two guards outside the antechamber. They think I'm in there.\"\n\n\"And you will be. In the morning.\"\n\n\"The servants...\"\n\n\"Come when I ring, or after the bells. I won't ring until you're up.\" Mina lifted her eyes at last. \"Besides, you're always up before the bells. I've heard you.\"\n\nChaeyoung opened her mouth and found she had run out of reasons somewhere around the second one.\n\n\"If you'd rather not...\" Mina said quickly, \"I'd understand. Truly. You've already done more than...\"\n\n\"I'll stay.\"\n\nIt came out much too fast. Mina blinked, and Chaeyoung felt the heat climb her own neck and could do nothing at all to stop it.\n\n\"If Your Highness wishes it,\" she added, far too late to help.\n\nMina ducked her head. It might have been to hide a smile. \"I do.\"\n\nChaeyoung took her sword down from the hook and leaned it against the nightstand, hilt up, where her hand would find it in the dark. She pulled off her boots and set them side by side by the headboard. Mina slid under the covers and moved over, far over, to the other edge, leaving most of the bed empty and the blanket turned back.\n\nChaeyoung lay down on top of it.\n\nOn top of the covers, dressed, on the very edge of the mattress, her back straight and her good arm folded over her chest.\n\nMina looked at her across the long stretch of empty sheet and watched Chaeyoung study the canopy with great concentration.\n\n\"You'll be cold,\" Mina said with a small laugh.\n\n\"I've been colder.\"\n\n\"On a wall in the north? With a troll?\"\n\n\"Exactly.\"\n\nMina made a small sound that might have been a laugh, and blew out the candle.\n\nIn the dark the room grew larger and quieter, and Chaeyoung could hear everything. The guard shifting his weight in the corridor. An owl somewhere over the gardens. Mina's breathing, careful and far too even, a princess pretending to sleep so that her guard would.\n\nAnd after a long while, the sheets rustled. Fingers found Chaeyoung's sleeve in the dark. They did not pull. They only held on, lightly, at the cuff, and through the linen came a warmth she already knew, faint and steady.\n\nOn the far side of the room the door to the antechamber stood open, and the narrow bed beyond it lay made and empty.\n\n---\n\nChaeyoung woke to birdsong and a weight against her chest, and knew before she opened her eyes.\n\nNot again.\n\nShe opened them anyway. Grey light, the thin kind that comes before the bells. The canopy overhead. And against her, fitted into her side as if someone had measured the space for it, Mina, fast asleep.\n\nChaeyoung had gone to sleep on the very edge of the mattress with her arm folded over her chest like a knight carved on a tomb, and she was still on the edge. It was the only part of the plan that had survived. At some point in the night the princess had crossed the whole wide stretch of empty sheet between them, blanket and all, and Chaeyoung's arm had unfolded and gone around her without asking anyone's permission. Now the Third Princess of Twiceland was tucked under her chin with a fistful of her shirt, and the blanket was the only thing in the bed that had kept to its post.\n\nAgain. You fell asleep again, Chaeyoung. Damn it.\n\nShe lay very still and did the arithmetic. The bells. The maids. What hour was it? The bed in the antechamber, still made with military corners, which would tell anyone who looked at it that nobody had slept there. The two guards in the corridor, who thought somebody had.\n\nShe had to go. Now.\n\nShe began to ease her arm out from under Mina's shoulders, a finger's width at a time.\n\nMina frowned in her sleep and followed it.\n\nChaeyoung stopped. The frown smoothed out. The fist in her shirt tightened, and settled, and Mina's breathing went back to slow and deep, warm against Chaeyoung's collar.\n\nChaeyoung looked at the canopy a while longer and let herself lose that particular battle. The bells had not rung yet. Maybe she had a little more time.\n\nIn the end it was Mina who moved first. This time she woke slowly. A deeper breath. Her nose pressed briefly into Chaeyoung's collar, as if to check what it was. Her fingers opened on the shirt, closed again, and then went very still while the rest of her caught up.\n\nChaeyoung felt the moment it happened. Felt the small hitch in her breathing, and the heat that climbed her neck, which Chaeyoung could not see and did not need to see either.\n\nMina did not lift her head. She spoke into Chaeyoung's shirt.\n\n\"You stayed.\"\n\n\"I said I would, Your Highness.\"\n\n\"I was on the other side of the bed.\" A pause, muffled and mortified. \"I'm certain I was on the other side.\"\n\n\"You were.\" Chaeyoung kept her eyes on the canopy and her voice perfectly grave. \"For a while, perhaps. Then you crossed the whole bed. I never stood a chance.\"\n\nA small sound came out of Mina, somewhere between a groan and a laugh, and she hid her face in Chaeyoung's shoulder. Then she seemed to realize where she was hiding, and sat up much too fast, and pushed her hair back from her face with both hands.\n\nHer cheek was pink. And there was a small round mark on it, pressed in by one of the buttons of Chaeyoung's shirt.\n\nChaeyoung decided not to mention the button.\n\n\"I'm sorry,\" Mina said. \"Again. I seem to spend every morning apologizing to you.\"\n\n\"Two mornings.\"\n\n\"That's every morning so far...\" She interrupted herself, looked down at her hands, and then, with an effort Chaeyoung could see, looked back up at her face. \"Thank you. For staying. I slept very well.\"\n\nChaeyoung found she had nothing clever to say to that. \"I'm glad,\" she said, and meant it more than was sensible.\n\nOutside the window a bird started up, very loud. Somewhere below them in the castle a door banged. Chaeyoung sat up and reached for her boots.\n\n\"I should go, Your Highness. Before the bells.\" She tugged the first boot on one-handed. \"The bed next door looks far too tidy for anyone who slept in it.\"\n\n\"Yes.\" Mina nodded, a little too quickly. \"Yes, of course. Go.\"\n\nChaeyoung buckled her sword belt and crossed to the antechamber door. With her hand on the frame, she glanced back once.\n\nMina was sitting in the middle of the big bed with the blanket in her lap, watching her go. When their eyes met, this time she did not look away. She lifted one hand from the blanket and gave a small, uncertain wave, as if she had never done it before and was not sure she was doing it right.\n\nChaeyoung went through the door before her face could do anything she would regret.\n\n---\n\nThe bed in the antechamber took some work.\n\nChaeyoung pulled the blanket half off and punched the pillow twice into a believable dent. She lay down on the mattress and rolled over once, carefully, on the good side. She kicked one corner of the sheet loose, stood back, and considered the result with a critical eye. A lieutenant had slept there, badly and alone, on a strange mattress. It was near enough the truth.\n\nThe first bell rang while she was splashing water on her face and getting ready to wash.\n\nA moment later, through the wall, she heard the little silver bell from Mina's room, and then the maids. The door, the clink of a basin, soft voices, the long creak of a wardrobe opening. Chaeyoung dried her face one-handed, reset the bandage where it had slipped in the night, and when she checked the stitches in the small mirror by the window, she noticed something very interesting.\n\nThe stitches had healed almost completely. As though by magic.\n\nChaeyoung inspected them carefully. She even pressed a finger down on them, and was surprised, and a little frightened, to feel no pain at all. She tugged lightly at one of the threads and it slid out of her shoulder as if it had never been anchored there, leaving a fine point where the thread had been, the only scar present.\n\nPerhaps it would be worth having Tzuyu look at this herself.\n\nShe abandoned the idea almost at once. She could already picture her sister asking a thousand questions about how it was possible, about what she had done, demanding a detailed report of every second of her routine. And Chaeyoung was not willing to run that risk.\n\nShe checked herself one last time, and when she heard movement outside, hurried to finish getting ready and went out into the corridor.\n\nThe two night guards straightened when they saw her.\n\n\"Lieutenant.\"\n\n\"Anything?\"\n\n\"Quiet night, Lieutenant. Not a sound.\"\n\n\"Good.\" Chaeyoung kept her face perfectly still. \"Get some sleep.\"\n\nThey went off down the corridor and the day guards took their places. Chaeyoung took hers beside the door of the princess's chambers, hands clasped behind her back, and waited.\n\nMina came out at the half bell.\n\nBlack silk, hair pinned up smooth, every trace of the girl in the big bed put away somewhere Chaeyoung could not see. She came through the door with her chin level and her hands folded, the Third Princess of Twiceland from her slippers to the last pin, and she looked at her guard exactly as a princess looks at her guard in the morning.\n\n\"Good morning, Lieutenant.\"\n\n\"Good morning, Your Highness.\"\n\nThe button mark was still on her cheek, faint and round. Chaeyoung fell into step behind her and said nothing about it at all.\n\n---\n\nBreakfast in the royal wing was laid in the small morning room at the end of the corridor, where the windows faced east over the gardens. On other mornings Mina had eaten there with her sisters. This morning Nayeon was already shut in with her councillors, and Sana, according to the maid who brought the tea, was still asleep and had left instructions to remain so until further notice.\n\nSo there was only Mina at the table, and Chaeyoung by the wall.\n\nMina poured her tea. She buttered a piece of bread with great concentration, right out to the edges. Then, without looking up, she pushed a second cup and a second plate across the table toward the empty chair opposite hers.\n\nChaeyoung looked at the chair and considered seriously what the princess was proposing without a single word.\n\nMina went on buttering bread.\n\nChaeyoung left the wall and sat.\n\nThey ate without saying much. The sun climbed while Mina read a letter from the small pile beside her plate, and Chaeyoung ate two pieces of bread and most of a third, because Tzuyu had told her to eat properly and Tzuyu would know if she hadn't.\n\nSomewhere between the second piece and the third, Chaeyoung remembered what day it was. She had to go and see her mother very soon. And she had not asked Jihyo for the pass yet. She had not told Mina about her coming absence either.\n\nEvery few weeks, for years, she had ridden to Bryndell without a second thought. Now she sat watching the princess turn a page with one finger while her tea went cold, and found that she had begun counting the hours she would be away from her.","perfil":{"on":false}}}</script>

      '<meta property="og:type" content="website">\n<meta property="og:site_name" content="Lilith’s Archive">\n<meta property="og:title" content="Lilith’s Archive">\n' +
      '<meta property="og:description" content="' + desc + '">\n<meta property="og:url" content="' + site + '">\n<meta property="og:image" content="' + site + 'og.png">\n' +
      '<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">\n<meta name="twitter:card" content="summary_large_image">\n' +
      '<meta name="twitter:title" content="Lilith’s Archive">\n<meta name="twitter:description" content="' + desc + '">\n<meta name="twitter:image" content="' + site + 'og.png">\n';
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n' + reset + '\n' + metas + HEAD_HTML +
      '\n<style id="app-style">' + style + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
      '<script id="fic-data" type="application/json">' + safeJson(data) + '<\/script>\n<script id="app-code">' + code + '<\/script>\n</body>\n</html>\n';
  }
  function ghSave() {
    if (!ghPrivOk) { saveErr = t('e_gh_nopriv', { r: GH.priv }); updateSaveBar(); return; }
    saving = true; saveErr = ''; updateSaveBar();
    DATA.meta.updated = today();
    var eb = document.querySelector('.eyebrow'); if (eb) eb.textContent = eyebrowTxt();
    var full = JSON.stringify(DATA, null, 1), pub = buildGhDoc(publicData(DATA));
    var msg = 'Actualiza el archivo · ' + new Date().toISOString().slice(0, 16).replace('T', ' ');
    ghApi(ghFile(GH.priv, 'data.json'), { method: 'PUT', body: { message: msg, content: b64enc(full), sha: ghPrivSha || undefined, branch: GH.branch } })
      .then(function (r) {
        ghPrivSha = r && r.content && r.content.sha;
        return ghApi(ghFile(GH.repo, 'index.html?ref=' + encodeURIComponent(GH.branch))).then(function (f) { return f.sha; }, function (e) { if (e.status === 404) return undefined; throw e; });
      })
      .then(function (sha) { return ghApi(ghFile(GH.repo, 'index.html'), { method: 'PUT', body: { message: msg, content: b64enc(pub), sha: sha, branch: GH.branch } }); })
      .then(function () { ORIGINAL = full; dirty = 0; saving = false; saveErr = ''; saveOk = t('m_saved_gh'); updateSaveBar(); clearTimeout(saveOkTimer); saveOkTimer = setTimeout(function () { saveOk = ''; updateSaveBar(); }, 6000); }, function (e) {
        saving = false;
        var st = e && e.status;
        saveErr = st === 409 ? t('e_gh_conflict') : (st === 401 || st === 403 || st === 404) ? t('e_gh_auth') : t('e_gen');
        updateSaveBar();
      });
  }

  route();
  renderShell();
  initSky();
  if (GH && ghToken()) ghEnter(ghToken(), true);

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (a) { ART = a; }, function () {});
    window.claude.use('user').then(function (u) { return u ? u.isOwner() : false; }).then(function (isO) {
      if (isO) { IS_OWNER = true; OWNER = !AS_VISITOR; route(); renderShell(); }
    }, function () {});
  }
})();
</script>
